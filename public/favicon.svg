<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra sutil exterior -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas -->
  <rect x="64" y="64" width="384" height="384" rx="96" ry="96" fill="#d9222a" filter="url(#shadow)" />

  <!-- Letra R en blanco -->
  <text x="256" y="345" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="240" fill="#ffffff" text-anchor="middle">R</text>
</svg>